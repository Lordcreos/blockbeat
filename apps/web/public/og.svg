<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Blockbeat</title>
  <desc id="desc">The Blockbeat title above a sixteen-step, eight-track sequencer grid with an illuminated playhead.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111118"/>
      <stop offset="0.55" stop-color="#08080c"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4d7cff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4d7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cell-glow" x="-80%" y="-120%" width="260%" height="340%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .cell { fill: #f2f2f5; fill-opacity: 0.075; stroke: #f2f2f5; stroke-opacity: 0.08; stroke-width: 1; }
      .play { fill: #f2f2f5; fill-opacity: 0.26; stroke: #f2f2f5; stroke-opacity: 0.58; stroke-width: 1.5; }
      .lit { fill-opacity: 1; stroke-opacity: 0.95; filter: url(#cell-glow); }
      .kick .lit { fill: #ff2e63; stroke: #ff2e63; }
      .snare .lit { fill: #ff8a00; stroke: #ff8a00; }
      .hat .lit { fill: #ffe600; stroke: #ffe600; }
      .clap .lit { fill: #3dff8f; stroke: #3dff8f; }
      .bass .lit { fill: #00e5ff; stroke: #00e5ff; }
      .lead .lit { fill: #4d7cff; stroke: #4d7cff; }
      .pad .lit { fill: #b36bff; stroke: #b36bff; }
      .fx .lit { fill: #ff5cf1; stroke: #ff5cf1; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <ellipse cx="588" cy="420" rx="510" ry="310" fill="url(#halo)"/>
  <path d="M70 225H1130" stroke="#f2f2f5" stroke-opacity="0.09"/>

  <text x="70" y="126" fill="#f2f2f5" font-family="Geist, Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">Blockbeat</text>
  <text x="70" y="182" fill="#f2f2f5" fill-opacity="0.76" font-family="Geist, Inter, system-ui, sans-serif" font-size="24" font-weight="500">The room composes. Monad keeps time. Every note is a transaction.</text>
  <text x="1130" y="102" fill="#f2f2f5" fill-opacity="0.48" font-family="Geist, Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2">1 BLOCK = 1 STEP</text>
  <text x="1130" y="130" fill="#00e5ff" font-family="Geist, Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2">300 MS</text>

